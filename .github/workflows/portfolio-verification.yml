name: Portfolio verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      ASSISTANT_LLM_API_KEY: ''
      ASSISTANT_LLM_BASE_URL: ''
      ASSISTANT_LLM_MODEL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npx puppeteer browsers install chrome
      - run: npm run verify
      - name: Browser and raw HTTP verification against production assets
        run: node scripts/run-browser-verification.js
